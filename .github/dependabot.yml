version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/bridge-starter-node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ingest-node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs-portal"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/benchmarks"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/ingest-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
